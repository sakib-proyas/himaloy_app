name: himaloy_inventory_mobile
description: "Mobile ERP and Field Force Automation app for Himaloy Agro Care"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Networking & Serialization
  dio: ^5.7.0
  json_annotation: ^4.9.0

  # Secure Storage & Caching
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # UI & Design
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1

  # Hardware Integration
  mobile_scanner: ^5.2.3
  printing: ^5.13.2
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

