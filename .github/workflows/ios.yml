name: Build iOS Release App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App on macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter (Pinned to 3.24.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup iOS Pods
        run: |
          cd ios
          pod install --repo-update || true
          cd ..

      - name: Build Unsigned iOS App for Physical Device
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          find build/ios -name "Runner.app" -type d -exec cp -r {} build/ios/ipa/Payload/ \;
          cd build/ios/ipa
          zip -r Himaloy_Agro_Care.ipa Payload

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Himaloy_Agro_Care_iOS_IPA
          path: build/ios/ipa/Himaloy_Agro_Care.ipa
