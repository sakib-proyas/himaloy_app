name: Build iOS Release App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App on macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter (Pinned to 3.24.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup iOS Pods
        run: |
          cd ios
          pod install || true
          cd ..

      - name: Build Unsigned iOS App for Physical Device
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          if [ -d "build/ios/iphoneos/Release-iphoneos/Runner.app" ]; then
            cp -r build/ios/iphoneos/Release-iphoneos/Runner.app build/ios/iphoneos/Payload/
          elif [ -d "build/ios/outputs/Release-iphoneos/Runner.app" ]; then
            cp -r build/ios/outputs/Release-iphoneos/Runner.app build/ios/iphoneos/Payload/
          else
            find ios -name "Runner.app" -exec cp -r {} build/ios/iphoneos/Payload/ \;
          fi
          cd build/ios/iphoneos
          zip -r Himaloy_Agro_Care.ipa Payload

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Himaloy_Agro_Care_iOS_IPA
          path: build/ios/iphoneos/Himaloy_Agro_Care.ipa
